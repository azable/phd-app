# Render Blueprint (https://render.com/docs/blueprint-spec); see README "Deployment".
services:
  - name: phd-app
    type: web
    runtime: node
    # Paid: the free plan sleeps after 15 idle minutes, cutting off running operations.
    # 2 GB: an out-of-memory restart would cut off a participant's operation; 512 MB ran near 60%.
    plan: 1c-2g
    region: singapore
    # Deploys main only after the GitHub CI checks pass.
    autoDeployTrigger: checksPass
    # Node 24 still bundles Corepack, which runs the pnpm pinned by packageManager.
    # --prod=false: the build needs devDependencies although NODE_ENV is production.
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm run build
    preDeployCommand: corepack pnpm run db:migrate
    startCommand: node build
    healthCheckPath: /api/health/ready
    # The most Render allows; runtime-state.ts drains active operations for 270 seconds.
    maxShutdownDelaySeconds: 300
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: phd-app-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # The public URL, e.g. https://phd-app.onrender.com. Passkeys are bound to its
      # hostname, so choose any custom domain before registering the administrator.
      - key: BETTER_AUTH_URL
        sync: false
      # The same URL, for SvelteKit's form-origin check behind Render's proxy.
      - key: ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: phd-app-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: '17'
